<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols ranked by implied launch value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot" aria-hidden="true"></span><h1>TOKEN RADAR</h1><span class="tag">radar-2</span></div>
  <p class="sub">Which pre-token protocol is worth farming next — and what to do about it.</p>
  <p class="meta" id="meta">Loading snapshot…</p>
</header>
<nav class="tabs" aria-label="Views">
  <button id="tab-board" class="tab on" type="button">Pre-token board</button>
  <button id="tab-live" class="tab" type="button">Live tokens</button>
</nav>
<section class="model" id="model-card" aria-label="How the value model works"></section>
<div class="toolbar" id="toolbar">
  <label>Search <input id="q" type="search" placeholder="name or slug" autocomplete="off"></label>
  <label>Category <select id="cat"><option value="all">All categories</option></select></label>
  <label>Chain <select id="chain"><option value="all">All chains</option></select></label>
  <label class="check"><input id="watch" type="checkbox"> Watchlist only</label>
  <span class="count" id="count"></span>
</div>
<main class="layout">
  <div class="table-wrap">
    <table id="board" aria-label="Ranked board">
      <thead><tr>
        <th data-sort="rank">#</th><th data-sort="name">Protocol</th><th data-sort="category">Category</th>
        <th data-sort="chains">Chains</th><th data-sort="tvl_usd" class="num">TVL</th>
        <th data-sort="change_7d" class="num">7d</th><th data-sort="age_days" class="num">No-token age</th>
        <th data-sort="implied_value_usd" class="num">Implied value</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="hint" id="hint"></p>
  </div>
  <aside class="detail" id="detail" aria-label="Protocol detail"></aside>
</main>
<footer class="foot" id="foot"></footer>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
